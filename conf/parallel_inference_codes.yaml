defaults:
  - _self_
  - override hydra/launcher: joblib  # Switched from basic to joblib for parallel execution

# Complete self-contained configuration for grid search
# Data configuration
data:
  input_data_retrieval_directory: 'AQUAS_DATA_RETRIEVAL/data/sample/multilayer_input/'
  output_data_retrieval_directory: 'AQUAS_DATA_RETRIEVAL/data/sample/multilayer_output/'
  data_path: '../data/FINAL_DB/demand_diagnosis_joined.parquet'
  codes_path: '../data/FINAL_DB/target_codes.json'
  models_folder: '../quantized_models'
output:
  output_path: "../production_predictions/final_output_predictions"
  metrics_df_path: "../production_predictions/production_evaluation_metrics.parquet"

experiment_setup: "7_7"  # Default experiment setup
help: False  # Flag to display help information

experiment_pairs:
  "3_3":   { lb: 3,   fc: 3 }
  "7_7":   { lb: 7,   fc: 7 }
  "14_14": { lb: 14,  fc: 14 }
  "60_30": { lb: 60,  fc: 30 }
  "60_60": { lb: 60,  fc: 60 }
  "182_182": { lb: 182,  fc: 182 }
  "365_182": { lb: 182,  fc: 365 }

# Model configuration
model:
  target_code: "DEMAND_demanda__TOTAL_UP_00185"
  lookback: ${experiment_pairs.${experiment_setup}.lb}
  forecast: ${experiment_pairs.${experiment_setup}.fc}
  num_transformer_blocks: 2
  head_size: 32
  num_heads: 8
  activation: "gelu"
  covid_token: true 
  ff_dim: 512
  mlp_units: [512,256]
  dropout: 0.5
  learning_rate: 1e-5

# Training configuration
training:
  cutoff_date: "2008-01-01"
  positional_encoding: true
  evaluate_model: false

inference:
  max_date: "2025-12-31"

# System configuration  
system:
  backend: "Agg"

# MLflow configuration
mlflow:
  tracking_uri: "file:./mlruns" #"sqlite:///mlflow.db"
  experiment_name: "Inference_TRANSFORMERS_PREDAP_HYDRA_GRID_SEARCH"

# Hydra multirun configuration
hydra:
  # =========================================================================
  # LAUNCHER CONFIGURATION FOR PARALLELIZATION
  # =========================================================================
  launcher:
    n_jobs: 8      # -1 uses all available CPU cores. Set to a specific int (e.g., 4) if VRAM limited.
    backend: loky    # Robust multiprocessing backend suited for numerical stacks like NumPy/TensorFlow
  
  sweep:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
    
  sweeper:
    params:
      # Target codes to evaluate parallelly
      model.target_code: ${load_inference_codes_not_done:${data.models_folder},../hydra_production_predictions/final_output_predictions} #${load_inference_codes_list:${data.models_folder}} #DEMAND_demanda__TOTAL_UP_00185, "DEMAND_demanda__TOTAL_RS_CATALUNYA CENTRAL" #${get_codes_list:${data.data_path}}
      
      # Fixed syntax for parameter sweeps (removed nested single quotes)
      experiment_setup:  '"7_7","14_14","60_30","60_60","182_182","365_182"'
      
      #inference.max_date: ${get_dates_list:${inference.max_date}}
      
      # Model architecture parameters
      model.num_transformer_blocks: 2
      model.head_size: 32
      model.num_heads: 8
      model.ff_dim: 512
      model.mlp_units: [512,256] 
      
      # Training hyperparameters
      model.activation: gelu
      model.covid_token: true
      model.dropout: 0.5
      model.learning_rate: 0.00001