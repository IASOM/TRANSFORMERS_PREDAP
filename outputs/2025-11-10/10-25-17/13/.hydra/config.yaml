data:
  data_path: ../data/date_2008-01-01_longitudinalitat_DIAGNOSTICS_GROUPED_timestamp.csv
model:
  target_code: T14
  lookback: 1
  forecast: 30
  num_transformer_blocks: 4
  head_size: 4
  num_heads: 4
  activation: tanh
  covid_token: false
  ff_dim: 32
  mlp_units: 64
  dropout: 0.5
  learning_rate: 1.0e-05
training:
  cutoff_date: '2008-01-01'
  positional_encoding: false
  evaluate_model: true
system:
  backend: Agg
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: TRANSFORMERS_PREDAP_HYDRA_GRID_SEARCH
