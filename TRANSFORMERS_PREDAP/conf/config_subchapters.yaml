defaults:
  - _self_

# Complete self-contained configuration for grid search
# Data configuration
data:
  data_path: '../data/diagnostics_subchapters_CAT_aggregated.parquet'

# Model configuration (base defaults that will be overridden by sweep parameters)
model:
  target_code: Ch10:subch10:J95-J95
  lookback: 7
  forecast: 7
  num_transformer_blocks: 2
  head_size: 16
  num_heads: 16
  activation: 'leaky_relu'
  covid_token: false
  ff_dim: 128
  mlp_units: 128
  dropout: 0.5
  learning_rate: 1e-5
  

# Training configuration
training:
  cutoff_date: "2007-01-01"  # Fixed: Use a date that ensures sufficient training data
  positional_encoding: false
  covid_token: true,false
  evaluate_model: true

# System configuration  
system:
  backend: "Agg"

# MLflow configuration
mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "TRANSFORMERS_PREDAP_HYDRA_GRID_SEARCH"

# Hydra multirun configuration
hydra:
  sweep:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    params:
      # Target codes to evaluate
      model.target_code: Ch10:subch10:J95-J95, Ch20:subch23:X30-X39, Ch21:subch13:Z68-Z68, Ch20:subch04:V10-V19, Ch08:subch05:H95-H95
      
      # Temporal parameters - lookback and forecast horizons
      model.lookback: 7,14,30,60
      model.forecast: 7,14,30,60
      
      # Model architecture parameters
      model.num_transformer_blocks: 4
      model.head_size: 16,32
      model.num_heads: 4,8
      model.ff_dim: 128,512
      model.mlp_units: 128,512
      
      # Training hyperparameters
      model.activation: leaky_relu
      model.covid_token: true, false
      model.dropout: 0.5
      model.learning_rate: 0.00001